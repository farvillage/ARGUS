name: ARGUS CI / Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write # Required for uploading SARIF reports to GitHub Code Scanning

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pytest Suite
        run: pytest -v

      - name: Generate SARIF Security Report
        run: |
          argus check examples/proxy_delegatecall_drainer.json --offline --format sarif > argus.sarif || true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codecode-action/upload-sarif@v3 # or github/codeql-action/upload-sarif@v3
        with:
          sarif_file: argus.sarif